site_name: pidprobe
site_description: "Structured JSON snapshots of running CPython 3.14+ processes via PEP 768 - no agent, no restart, no gdb"
site_url: https://tomada1114.github.io/pidprobe
repo_url: https://github.com/tomada1114/pidprobe
repo_name: tomada1114/pidprobe
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Demo: demo.md
  - API Reference: reference.md
  - Output Schema: output-schema.md
  - Collector Plugins: plugins.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
